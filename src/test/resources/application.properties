spring.datasource.url=jdbc:h2:mem:viagemdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=
spring.flyway.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/local
viagem-exchange=viagem-exchange
presenca-queue=presenca-queue
